server.port=8080

# ---- MySQL (change the password to yours) ----
spring.datasource.url=jdbc:mysql://localhost:3306/nutriscan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.jwt.secret=${JWT_SECRET:nutriscan-dev-secret-change-me-please-32chars-min}

# ---- Anthropic API key (for AI food detection + recommendations) ----
# Replace PASTE_YOUR_KEY_HERE with your key (sk-ant-...). Never share this file after adding the key.
anthropic.api.key=${ANTHROPIC_API_KEY:}