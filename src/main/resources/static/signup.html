<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        Create account · NutriScan AI
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <main class="auth">

        <div class="card">

            <a
                class="brand"
                href="/"
                style="padding-left:0"
            >
                <i>🌿</i>
                NutriScan AI
            </a>


            <h1>
                Create your account
            </h1>


            <p class="sub">
                Free to start. Your first scan takes 10 seconds.
            </p>


            <form id="f">

                <div class="field">

                    <label for="n">
                        Full name
                    </label>

                    <input
                        class="input"
                        id="n"
                        name="name"
                        required
                        placeholder="Your name"
                    >

                </div>


                <div class="field">

                    <label for="e">
                        Email
                    </label>

                    <input
                        class="input"
                        id="e"
                        name="email"
                        type="email"
                        required
                        placeholder="you@example.com"
                    >

                </div>


                <div class="field">

                    <label for="p">
                        Password
                    </label>

                    <input
                        class="input"
                        id="p"
                        name="password"
                        type="password"
                        minlength="6"
                        required
                        placeholder="At least 6 characters"
                    >

                </div>


                <button
                    class="btn primary"
                    id="go"
                    style="width:100%"
                >
                    Sign up
                </button>

            </form>


            <p
                style="margin-top:18px;text-align:center;color:var(--mut)"
            >

                Already have an account?

                <a
                    href="/login.html"
                    style="color:var(--leaf);font-weight:700"
                >
                    Log in
                </a>

            </p>

        </div>

    </main>


    <script src="/js/app.js"></script>


    <script>

        document.getElementById('f').onsubmit =
            async e => {

                e.preventDefault();


                const b =
                    document.getElementById('go');


                b.disabled =
                    true;


                try {

                    const d =
                        await NS.api(
                            '/auth/signup',
                            {
                                method: 'POST',
                                body: Object.fromEntries(
                                    new FormData(e.target)
                                )
                            }
                        );


                    localStorage.setItem(
                        'ns_token',
                        d.token
                    );


                    location.href =
                        '/dashboard.html';

                }


                catch (x) {

                    NS.toast(
                        x.message,
                        true
                    );


                    b.disabled =
                        false;

                }

            };


        if (
            NS.token()
        )

            location.href =
                '/dashboard.html';

    </script>

</body>

</html>
