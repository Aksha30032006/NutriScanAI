<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · NutriScan AI</title><link rel="stylesheet" href="css/style.css"></head><body><div id="view" class="hide">
<div class="grid g2"><form class="card" id="f1"><h3>Display name</h3><div class="field"><input class="input" name="name" required></div><button class="btn primary">Save name</button></form>
<form class="card" id="f2"><h3>Change password</h3><div class="field"><label>Current password</label><input class="input" name="current" type="password" required></div><div class="field"><label>New password</label><input class="input" name="next" type="password" minlength="6" required></div><button class="btn primary">Update password</button></form></div>
<div class="card mt"><h3>Delete account</h3><p style="color:var(--mut);margin-bottom:14px">This removes your profile, scans and water logs permanently.</p><button class="btn danger" id="del">Delete my account</button></div></div><script src="js/config.js"></script><script src="js/app.js"></script><script>(async()=>{const me=await NS.shell("settings",'Settings','Account and security');
const f1=document.getElementById('f1'),f2=document.getElementById('f2');f1.name.value=me.name;
f1.onsubmit=async e=>{e.preventDefault();try{await NS.api('/me',{method:'PUT',body:{name:f1.name.value}});NS.toast('Name updated')}catch(x){NS.toast(x.message,true)}};
f2.onsubmit=async e=>{e.preventDefault();try{await NS.api('/me/password',{method:'PUT',body:Object.fromEntries(new FormData(f2))});f2.reset();NS.toast('Password updated')}catch(x){NS.toast(x.message,true)}};
document.getElementById('del').onclick=async()=>{if(confirm('Delete your account for good?')){await NS.api('/me',{method:'DELETE'});NS.logout()}};
})().catch(e=>console.error(e));</script></body></html>
