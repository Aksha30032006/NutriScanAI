<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your progress · NutriScan AI</title><link rel="stylesheet" href="css/style.css"></head><body><div id="view" class="hide">
<div class="grid g3"><div class="card stat"><small>🔥 Calories this week</small><b id="c"></b></div><div class="card stat"><small>🥩 Protein this week</small><b id="p"></b></div><div class="card stat"><small>📸 Meals scanned</small><b id="n"></b></div></div>
<div class="grid g2 mt"><div class="card"><h3>Daily calories</h3><div id="ch1"></div></div><div class="card"><h3>Daily protein (g)</h3><div id="ch2"></div></div></div>
<div class="card mt"><h3>Insight</h3><p id="ins" style="color:var(--mut)"></p></div></div><script src="js/config.js"></script><script src="js/app.js"></script><script>(async()=>{const me=await NS.shell("progress",'Your progress','Track your nutrition journey');
const s=await NS.api('/stats');document.getElementById('c').textContent=s.week.calories.toLocaleString()+' kcal';document.getElementById('p').textContent=s.week.protein+' g';document.getElementById('n').textContent=s.week.scans;
NS.bars(document.getElementById('ch1'),s.days,'calories');NS.bars(document.getElementById('ch2'),s.days,'protein');
const act=s.days.filter(d=>d.scans);const avg=act.length?Math.round(act.reduce((a,d)=>a+d.calories,0)/act.length):0;
document.getElementById('ins').textContent=act.length?`You logged meals on ${act.length} of 7 days, averaging ${avg} kcal on those days against a target of ${me.calTarget} kcal. ${avg>me.calTarget?'Try lighter dinners to come back under target.':'You are within target. Keep it going.'}`:'Scan a few meals and your weekly insight will show up here.';
})().catch(e=>console.error(e));</script></body></html>
