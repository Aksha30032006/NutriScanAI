<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Nutrition analysis · NutriScan AI
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div
        id="view"
        class="hide"
    >

        <div class="grid g21">

            <div class="card">

                <div
                    class="row"
                    style="background:none;padding:0"
                >

                    <img
                        id="im"
                        alt=""
                        style="width:110px;height:110px"
                    >

                    <div>

                        <h2
                            id="nm"
                            style="font-size:1.8rem"
                        ></h2>

                        <small
                            id="dt"
                            style="color:var(--mut)"
                        ></small>

                    </div>

                </div>


                <h3 class="mt">
                    Nutrition facts
                </h3>


                <div
                    class="grid g4"
                    id="m"
                ></div>

            </div>


            <div class="card">

                <h3>
                    Macro split
                </h3>

                <div id="don"></div>

            </div>

        </div>


        <div class="card mt">

            <h3>
                Recommendations for you
            </h3>

            <div
                class="list"
                id="tips"
            ></div>


            <div
                style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"
            >

                <a
                    class="btn primary"
                    href="/scan.html"
                >
                    Scan another
                </a>

                <a
                    class="btn"
                    href="/history.html"
                >
                    View history
                </a>

            </div>

        </div>

    </div>


    <script src="/js/app.js"></script>


    <script>

        (async () => {

            const me = await NS.shell(
                "scan",
                'Nutrition analysis',
                'Your food, analysed by AI'
            );


            const id =
                new URLSearchParams(
                    location.search
                ).get('id');


            let s;


            try {

                s =
                    await NS.api(
                        '/scans/' + id
                    );

            }

            catch {

                location.href =
                    '/history.html';

                return;

            }


            document.getElementById('im').src =
                s.image;


            document.getElementById('nm').textContent =
                s.emoji + ' ' + s.name;


            document.getElementById('dt').textContent =
                new Date(
                    s.createdAt
                ).toLocaleString();


            if (s.ai) {

                document.getElementById('dt').textContent +=
                    ' · ✨ AI analysed';

            }


            document.getElementById('m').innerHTML =

                [
                    [
                        'cal',
                        '🔥',
                        s.calories,
                        'kcal',
                        'Calories'
                    ],
                    [
                        'pro',
                        '🥩',
                        s.protein,
                        'g',
                        'Protein'
                    ],
                    [
                        'car',
                        '🍞',
                        s.carbs,
                        'g',
                        'Carbs'
                    ],
                    [
                        'fat',
                        '🥑',
                        s.fat,
                        'g',
                        'Fat'
                    ]
                ]

                    .map(
                        a =>
                            `<div class="macro ${a[0]}">

                                ${a[1]}

                                <b>
                                    ${a[2]}

                                    <small style="font-size:.9rem">
                                        ${a[3]}
                                    </small>

                                </b>

                                ${a[4]}

                            </div>`
                    )

                    .join('');


            NS.donut(
                document.getElementById('don'),
                s.protein,
                s.carbs,
                s.fat
            );


            document.getElementById('tips').innerHTML =
                (s.tips || [])

                    .map(
                        t =>
                            `<div class="row">

                                💡

                                <div class="grow">
                                    ${NS.esc(t)}
                                </div>

                            </div>`
                    )

                    .join('');

        })().catch(
            e => console.error(e)
        );

    </script>

</body>

</html>
