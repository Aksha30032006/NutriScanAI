<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Meal plan · NutriScan AI
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div
        id="view"
        class="hide"
    >

        <div
            class="card"
            style="margin-bottom:18px"
        >

            <b id="g"></b>

        </div>


        <div
            class="grid g2"
            id="m"
        ></div>

    </div>


    <script src="/js/app.js"></script>


    <script>

        (async () => {

            const me = await NS.shell(
                "mealplan",
                'Meal plan',
                'A day of eating matched to your goal'
            );


            const p =
                await NS.api('/mealplan');


            document.getElementById('g').textContent =
                `Goal: ${p.goal} · Target ${me.calTarget} kcal`;


            document.getElementById('m').innerHTML =
                p.meals

                    .map(
                        m =>
                            `<div class="card">

                                <h3>
                                    ${m.meal}
                                </h3>

                                <p>
                                    ${NS.esc(m.text)}
                                </p>

                                <span
                                    class="pill"
                                    style="display:inline-block;margin-top:12px"
                                >
                                    about ${m.kcal} kcal
                                </span>

                            </div>`
                    )

                    .join('');

        })().catch(
            e => console.error(e)
        );

    </script>

</body>

</html>
