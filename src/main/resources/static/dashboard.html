<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Home · NutriScan AI
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div
        id="view"
        class="hide"
    >

        <div class="banner">

            <div>

                <h2>
                    Ready for your next meal?
                </h2>

                <p>
                    Scan your plate and see the nutrition in seconds.
                </p>

            </div>

            <a
                class="btn primary"
                href="/scan.html"
            >
                📸 Scan a meal
            </a>

        </div>


        <div
            class="grid g4"
            id="stats"
        ></div>


        <div class="grid g21 mt">

            <div class="card">

                <h3>
                    Calories this week
                </h3>

                <div id="chart"></div>

            </div>


            <div class="card">

                <h3>
                    Today's macros
                </h3>

                <div id="don"></div>

            </div>

        </div>


        <div class="grid g21 mt">

            <div class="card">

                <h3>
                    Recent scans
                </h3>

                <div
                    class="list"
                    id="recent"
                ></div>

            </div>


            <div class="card">

                <h3>
                    Quick actions
                </h3>

                <div class="list">

                    <a
                        class="btn primary"
                        href="/scan.html"
                    >
                        📸 Scan a meal
                    </a>

                    <a
                        class="btn"
                        href="/water.html"
                    >
                        💧 Log water
                    </a>

                    <a
                        class="btn"
                        href="/mealplan.html"
                    >
                        🍽️ Today's meal plan
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="/js/app.js"></script>


    <script>

        (async () => {

            const me = await NS.shell(
                "dashboard",
                'Home',
                'Your day at a glance'
            );


            const [s, r] = await Promise.all([
                NS.api('/stats'),
                NS.api('/scans?limit=5')
            ]);


            const t = s.today;


            const card = (l, v, u, pct) =>
                `<div class="card stat">

                    <small>
                        ${l}
                    </small>

                    <b>
                        ${v}

                        <small
                            style="display:inline;font-size:.9rem"
                        >
                            ${u}
                        </small>

                    </b>

                    <div class="bar">

                        <span
                            style="width:${Math.min(100, pct)}%"
                        ></span>

                    </div>

                </div>`;


            document.getElementById('stats').innerHTML =
                card(
                    '🔥 Calories today',
                    t.calories,
                    '/ ' + me.calTarget + ' kcal',
                    t.calories / me.calTarget * 100
                )

                +

                card(
                    '🥩 Protein today',
                    t.protein,
                    '/ ' + me.proteinTarget + ' g',
                    t.protein / me.proteinTarget * 100
                )

                +

                card(
                    '💧 Water today',
                    (t.water / 1000).toFixed(2),
                    '/ ' + me.waterTarget + ' L',
                    t.water / (me.waterTarget * 1000) * 100
                )

                +

                card(
                    '🔥 Scan streak',
                    s.streak,
                    'days',
                    s.streak / 7 * 100
                );


            NS.bars(
                document.getElementById('chart'),
                s.days,
                'calories'
            );


            NS.donut(
                document.getElementById('don'),
                t.protein,
                t.carbs,
                t.fat
            );


            document.getElementById('recent').innerHTML =
                r.length
                    ? r.map(NS.scanRow).join('')
                    : '<p class="empty">No scans yet. Scan your first meal to see it here.</p>';


        })().catch(
            e => console.error(e)
        );

    </script>

</body>

</html>
