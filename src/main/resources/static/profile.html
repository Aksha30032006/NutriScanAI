<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile · NutriScan AI</title><link rel="stylesheet" href="css/style.css"></head><body><div id="view" class="hide">
<div class="grid g2"><div class="card"><div class="row" style="background:none;padding:0"><div class="avatar" style="width:72px;height:72px;font-size:1.8rem" id="av"></div><div><h2 id="nm"></h2><p style="color:var(--mut)" id="em"></p><span class="pill" id="gl"></span></div></div>
<h3 class="mt">Daily target</h3><div class="list" id="tg"></div></div>
<form class="card" id="f"><h3>Body details</h3><div class="grid g3"><div class="field"><label>Age</label><input class="input" name="age" type="number" min="10" max="100"></div><div class="field"><label>Height (cm)</label><input class="input" name="height" type="number" min="100" max="250"></div><div class="field"><label>Weight (kg)</label><input class="input" name="weight" type="number" min="25" max="300"></div></div>
<button class="btn primary">Save details</button><p id="bmi" class="mt" style="color:var(--mut)"></p></form></div></div><script src="js/config.js"></script><script src="js/app.js"></script><script>(async()=>{const me=await NS.shell("profile",'My profile','Your details and daily targets');
document.getElementById('av').textContent=me.name[0].toUpperCase();document.getElementById('nm').textContent=me.name;document.getElementById('em').textContent=me.email;document.getElementById('gl').textContent='Goal: '+me.goal;
document.getElementById('tg').innerHTML=[['🔥 Calories',me.calTarget+' kcal'],['🥩 Protein',me.proteinTarget+' g'],['💧 Water',me.waterTarget+' L']].map(a=>`<div class="row"><div class="grow">${a[0]}</div><b>${a[1]}</b></div>`).join('');
const f=document.getElementById('f');for(const k of ['age','height','weight'])if(me[k])f[k].value=me[k];
const bmi=()=>{const h=f.height.value/100,w=f.weight.value;if(!h||!w)return;const b=w/(h*h);document.getElementById('bmi').textContent=`Your BMI is ${b.toFixed(1)} (${b<18.5?'underweight':b<25?'healthy range':b<30?'overweight':'obese'} range). BMI is a rough guide only.`};bmi();
f.onsubmit=async e=>{e.preventDefault();try{await NS.api('/me',{method:'PUT',body:Object.fromEntries(new FormData(f))});NS.toast('Details saved');bmi()}catch(x){NS.toast(x.message,true)}};
})().catch(e=>console.error(e));</script></body></html>
